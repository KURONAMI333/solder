modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/KURONAMI333/solder/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/mod/solder"
logoFile = "${mod_id}.png"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# Both hosts are optional: the mixin config plugin decides at load time whether
# the seam is open, so an install without them simply does nothing.
[[dependencies.${mod_id}]]
modId = "sodium"
type = "optional"
versionRange = "${sodium_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "iris"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
