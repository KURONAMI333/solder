# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=0.1.0
group=com.kuronami.solder
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Solder: Sodium & Iris Optimization Fix
mod_author=KURONAMI
mod_id=solder
license=MIT
credits=
description=Restores the fog and sky colour fast paths that Sodium ships and Iris disables as a side effect of a package-level mixin rule.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Sodium (compile-only; see multiloader-common.gradle)
# Upper bound is the highest version confirmed at runtime (compat matrix
# 2026-08-05: 0.6.13 with Iris 1.8.12, 0.8.12 with Iris 1.8.14-beta.1).
sodium_version_range=[0.6,0.9)
sodium_neoforge=mc1.21.1-0.6.13-neoforge
sodium_fabric=mc1.21.1-0.6.13-fabric

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# Forge
forge_version=52.0.28
forge_loader_version_range=[52,)

# NeoForge
neoforge_version=21.1.227
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
